services:
  todoapp:
    build: .
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: todoapp-kafka:9092
      POSTGRES_HOST: todoapp-postgres
      POSTGRES_PORT: 5432
      REDIS_ADDR: todoapp-redis:6379
    depends_on:
      - todoapp-kafka
      - todoapp-postgres
      - todoapp-redis
      - todoapp-kafka-ui

  todoapp-postgres:
    image: postgres:18.6-bookworm
    container_name: todoapp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  todoapp-redis:
    image: redis:8-alpine
    container_name: todoapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
  
  todoapp-kafka:
    image: apache/kafka:4.3.1
    container_name: todoapp-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kafka-logs
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://todoapp-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@todoapp-kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
  todoapp-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: todoapp-kafka-ui
    ports:
      - "5679:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: todoapp-kafka:9092

volumes:
  pg_data:
  redis_data:
  kafka_data: